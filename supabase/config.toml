# The local development database for `pnpm db:start` (Supabase CLI). Only the
# keys that carry a decision are set; every other key is the CLI's default
# (reference: https://supabase.com/docs/guides/local-development/cli/config).
# Container names derive from project_id: supabase_db_waste.
project_id = "waste"

[api]
# ADR-0001: the domain schema `wms` is never exposed. These are the defaults,
# written out so the decision is visible.
schemas = ["public", "graphql_public"]

[db]
port = 54322
shadow_port = 54320
# Must match the hosted project (waste-pilot, Postgres 17).
major_version = 17

[db.migrations]
# Migrations are Drizzle SQL files in packages/db/migrations (Issue #64); the CLI only runs the local stack.
enabled = false

[db.seed]
# The CLI's seed.sql is unused: the demo company is `pnpm db:seed`, Drizzle statements
# from packages/db/src/seed/demo.ts run as the owner after the migrations (Issue #70).
enabled = false

# The Auth decisions below are the hosted project's, kept in the repository
# so `supabase config push` can apply them; on the Pilot the Owner sets them
# in the dashboard (README.md, "A tester's User Account and Login"). They have
# no effect on `pnpm db:start`, which is `supabase db start`, the database
# container alone. They do govern `pnpm stack:start` (Issue #151), which
# brings up Postgres, Kong and GoTrue so the API e2e suite signs in through
# the real password grant and the real hook.
[auth]
# Local Auth signs ES256, as the hosted project does, with the key at this
# path — relative to this file, gitignored by name, and written by
# `pnpm db:signing-key` (packages/db/scripts/signing-key.ts) when absent,
# which every root command that starts or stops the stack runs first: the CLI
# fails to load this config while the file is missing and `supabase gen
# signing-key` refuses for the same reason. Minted per clone and per CI run,
# never committed; `supabase config push` does not carry signing keys, so the
# hosted project's keys are untouched by this line.
signing_keys_path = "./signing_keys.json"
# Sign-up is off: a User Account is created by an administrator (the demo
# seed, or POST /users) and its Login by the Supabase organisation's Owner in
# the dashboard. The access token hook below binds an invited
# `wms.user_account` row by e-mail, which is safe only under this rule — with
# open sign-up anyone could claim an invited address, and with it a company.
enable_signup = false
# The temporary password the Owner hands over and the one the tester replaces
# it with (Change password, in the web's account menu) are both at least
# twelve characters (Issue #150); Auth refuses a shorter one in its own words.
minimum_password_length = 12
# The built-in mailer is deliberately not relied on for account delivery or
# recovery on the Pilot: it reaches only the members of the Supabase
# organisation's Team, two messages an hour (research, #120). No invitation,
# confirmation or recovery mail is part of any procedure; a Login is created,
# and its password reset, by the Owner. The other Auth e-mail settings stay at
# their defaults.

[auth.hook.custom_access_token]
# `public.custom_access_token_hook`, created by migration
# 0002_organisation_access (Issue #70) and replaced whole in 0005_hook_email
# (Issues #75, #76): it binds the account on first sign-in, when exactly one
# open invitation carries the address, and puts that account's home company
# into the token as `app_metadata.company_id`, the one custom claim the API
# reads. It runs on every token issue, refresh included.
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"
