name: Store the login record and read it back
description: >-
  The write barrier's step between its record and its close (Issue #152,
  packages/db/src/pilot/barrier.ts), which no script can take: the login
  record the `record` phase wrote, stored as the run's artifact for 90 days —
  where recover-logins finds it — and read back, the download refusing a
  digest that differs, into the directory the next phase closes the barrier
  over. Every input is the record step's output, so no name is typed twice.
inputs:
  name:
    description: The record step's `artifact` output, `login-state-<run>-<attempt>`.
    required: true
  path:
    description: The record step's `file` output, the login record.
    required: true
  copy:
    description: The record step's `copy` output, where the record is read back.
    required: true
runs:
  using: composite
  steps:
    - name: Store the login record
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: error
        retention-days: 90
    - name: Read the login record back
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.copy }}
        digest-mismatch: error
