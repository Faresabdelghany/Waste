name: CI

# A change that touches nothing but documentation or session handoff notes
# starts no run (#139). That is safe only while no check is required: a
# workflow that paths-ignore skips leaves a required check waiting as
# "Expected" and the pull request unmergeable, so adopting required checks
# moves this filter inside the jobs (a first job that decides, the others
# `if:` on it).
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".remember/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".remember/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1
  # The local Supabase stack the database steps below start (see .env.example).
  DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
  DATABASE_URL: postgresql://wms_api:wms_api@127.0.0.1:54322/postgres
  # The worker role's login (migration 0011); `pnpm db:bootstrap` gives it below.
  # The worker's suites read it: the generation test (#97 part B) logs in as
  # this role, pointed at a database of its own, for the sweep that reads
  # across companies; the relay test (#104 part C) runs the sweep as this
  # role and the stamp as the API role on another, reaching both with these
  # cluster-wide logins; the `run-billing` suite (#112 part B) sweeps the
  # active projects on this role's pool, the way the process does; the boot
  # test runs pg-boss as the owner on its own database. `pnpm test` reads it,
  # and REQUIRE_DATABASE below makes its absence a failure.
  WORKER_DATABASE_URL: postgresql://wms_worker:wms_worker@127.0.0.1:54322/postgres
  # A database test may not skip here.
  REQUIRE_DATABASE: "1"
  # The API refuses to start without the project whose tokens it verifies; its
  # tests sign tokens with a key set they generate and never fetch this one.
  SUPABASE_URL: https://example.supabase.co

jobs:
  verify:
    name: Install, typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - run: pnpm typecheck
      - run: pnpm lint

      # The database tests run against the same Postgres image as the hosted
      # project: the Supabase CLI (a root devDependency, so pnpm install brought
      # it) starts one container on the runner's Docker, migrations apply
      # through packages/db, and the API role gets its local login. Its images
      # come from the Actions cache once a run has pulled them, and a failed
      # start is stopped and retried once (#437).
      - uses: ./.github/actions/supabase-start
        with:
          command: pnpm db:start
          name: db
      - run: pnpm db:migrate
      - run: pnpm db:bootstrap
      # The demo company, as a fresh clone gets it: this step proves the seed
      # runs on a fresh stack, and it puts the company on the database the
      # suites below share. It runs once, so it says nothing about
      # idempotency; seed.test.ts proves that, on a database of its own.
      - run: pnpm db:seed

      # The Pilot's backup and restore (#152), rehearsed on this stack with
      # the client the protected workflow uses: the migrated and seeded
      # database backed up by pilot-backup.sh, its three schemas dropped,
      # restored by pilot-restore.sh inside the write barrier, and proved by
      # the journal check and its own fingerprint. The suites below then run
      # against the restored database, which makes every one of them a smoke
      # test of the restore. Client 17 is required here: its absence fails
      # the rehearsal and, through REQUIRE_DATABASE, pilot-rehearsal.test.ts.
      - uses: ./.github/actions/postgres-client
      - run: pnpm --filter @waste/db rehearse-restore

      - run: pnpm test
      - run: pnpm build

  pilot-image:
    name: Build pilot image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Pilot's image (apps/pilot/Dockerfile: the API and the worker
      # under the supervisor, bundled; ADR-0008), built from the repository
      # root on buildx, its layers cached in GitHub's cache between runs,
      # loaded and pushed nowhere: Suga builds the Pilot's own copy from the
      # `pilot` branch, and this job is the proof that the Dockerfile builds
      # and the container behaves. The commit goes in as SOURCE_COMMIT
      # (#152): the image labels itself with it and bakes it into the API's
      # build.json, which GET /healthz names; on the deploy branch the same
      # file is written from apps/pilot/release.json.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/pilot/Dockerfile
          push: false
          load: true
          tags: waste-pilot:ci
          build-args: SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=pilot
          cache-to: type=gha,scope=pilot,mode=max

      # Against a database nobody answers on: the API answers /readyz 503
      # (@waste/db/probe) and /healthz 200 naming this commit, the worker
      # child exits and the supervisor restarts it with backoff — its first
      # "restarting in 5 s" line, then a second start — while the API keeps
      # answering, and `docker stop` ends the container cleanly with exit 0
      # through the supervisor's forwarded SIGTERM. Both waits poll with a
      # deadline: up to 40 s for the API (the bundles boot in about two
      # seconds here), up to 40 s for the second start, since the worker's
      # exit and its 5 s backoff run beside the API's boot at whatever share
      # of a core the runner gives.
      - name: Start the image
        run: |
          docker run --detach --name pilot --publish 3001:3001 \
            --env DATABASE_URL=postgresql://wms_api:x@127.0.0.1:1/postgres \
            --env WORKER_DATABASE_URL=postgresql://wms_worker:x@127.0.0.1:1/postgres \
            --env SUPABASE_URL="$SUPABASE_URL" \
            waste-pilot:ci
      - name: Smoke test the probes
        uses: ./.github/actions/smoke-probes
        with:
          urls: http://127.0.0.1:3001
          ready: "503"
          attempts: "40"
          interval: "1"
          container: pilot
          commit: ${{ github.sha }}
          image: waste-pilot:ci
      - name: Smoke test the supervisor
        run: |
          status() { curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:3001$1" || echo 000; }
          for _ in $(seq 1 40); do
            [ "$(docker logs pilot 2>&1 | grep -c '^\[pilot\] worker started pid=')" -ge 2 ] && break
            sleep 1
          done
          docker logs pilot 2>&1 | grep -E '^\[pilot\] worker exited code=1 signal=null after [0-9.]+ s; restarting in 5 s$' || { echo "::error::no worker restart with a 5 s backoff in the supervisor's log"; exit 1; }
          test "$(docker logs pilot 2>&1 | grep -c '^\[pilot\] worker started pid=')" -ge 2 || { echo "::error::the worker was not started a second time within 40 s"; exit 1; }
          test "$(status /healthz)" = 200
          docker stop pilot >/dev/null
          test "$(docker inspect --format '{{.State.ExitCode}}' pilot)" = 0
          docker logs pilot 2>&1 | grep -qx '\[pilot\] exiting with 0'
      - name: Container logs
        if: always()
        run: docker logs pilot 2>&1 | grep -E '^\[pilot\]' || true

  e2e:
    name: End-to-end (web, Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/playwright-browser

      # The root tsconfig excludes e2e/, so `pnpm typecheck` in verify never
      # sees a spec; this is the one type check the suite gets.
      - run: pnpm typecheck:e2e

      # The web app alone: the suite needs no database and no API (fixture
      # data and localStorage; the one external service, OSRM, is stubbed
      # per test and the tile servers are aborted). verify builds the web app
      # too, through `pnpm build`; this job builds it again on purpose rather
      # than waiting on that job, since the two run side by side and the wait
      # plus the download of a .next output would cost about what the build
      # does — the minute and a half is the price of the wall time saved.
      # playwright.config.ts serves this build on port 3000 under CI, waits
      # for it to answer, and runs the suite with two retries; locally there
      # is no managed server.
      - run: pnpm --filter @waste/web build
      - run: pnpm test:e2e

      # Always, not only on failure: a spec that failed once and passed on a
      # retry leaves the job green (the github reporter annotates it flaky)
      # and its failed attempt's trace is the one thing that says why.
      # `if-no-files-found: ignore` covers the clean case.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14
          if-no-files-found: ignore

  e2e-api:
    name: End-to-end (web → API → database, Playwright)
    runs-on: ubuntu-latest
    # The pull-request budget is wall time (#131): a run is meant to finish
    # inside verify's, and a broken one is stopped by Playwright's eleven-minute
    # globalTimeout (playwright.api.config.ts) with the report still written;
    # raised from eight once the suite itself ran about five minutes (#151's
    # generation scenario, the Finance slices).
    # This bound is the backstop behind that, wide enough that the pulls, the
    # build and the readiness wait before Playwright cannot eat the margin: a
    # job that times out is cancelled, and a cancelled job uploads nothing.
    # Measured on the first runs: see the pull request that added the job
    # (#151).
    timeout-minutes: 35
    env:
      # The API verifies tokens from the stack's own Auth, behind Kong on
      # 54321 (supabase/config.toml's default): the workflow-level placeholder
      # is overridden here and nowhere else.
      SUPABASE_URL: http://127.0.0.1:54321
      # The seeded primary administrator (packages/db/src/seed/demo.ts), and
      # the tester whose Login every local plan holds and whose account the
      # suite invites (apps/web/e2e-api/tester.ts). The password is the public
      # local default every local Login gets (packages/db/src/local-stack/
      # logins.ts), so it is set nowhere here.
      E2E_LOGIN_EMAIL: fares.abdelghany@kystbyen.example
      E2E_TESTER_EMAIL: e2e-tester@waste-e2e.example
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      # The deterministic fake routing provider (@waste/routing/select), named
      # rather than left to the default: the generation scenario
      # (apps/web/e2e-api/map-routes.spec.ts) asserts the legs it measured,
      # and no OpenRouteService credential exists on the public repository.
      ROUTING_PROVIDER: fake
      # The fake address register (apps/api/src/address-register/select.ts),
      # named, since unset is no register at all and the picker scenario in
      # registry-round-trips.spec.ts picks from it; no Dataforsyningen token
      # exists here.
      ADDRESS_PROVIDER: fake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/playwright-browser

      # The trimmed local stack — Postgres, Kong, GoTrue and Storage (the
      # proofs' private bucket, O1 of #290), the other services excluded by name — migrated, bootstrapped, seeded and given
      # its Logins, by the one root script developers run (root CLAUDE.md,
      # Commands). The ES256 signing key is minted on this runner first and
      # dies with it. The images come from the Actions cache once a run has
      # pulled them, under a key of their own beside the verify job's, and a
      # failed start is stopped and retried once (#437).
      - uses: ./.github/actions/supabase-start
        with:
          command: pnpm stack:start
          name: stack

      # The web built with the adapter on: the two Supabase variables are
      # inlined at build time (apps/web/lib/api/config.ts), so this build is
      # not the fixture job's and cannot be shared with it. The stack's URL
      # and publishable key are read from the CLI's status rather than spelled
      # here; with a signing key configured the CLI re-signs the legacy keys
      # per run, so nothing in this file could be right twice.
      - name: Read the stack's URL and publishable key
        run: |
          eval "$(pnpm exec supabase status -o env | grep -E '^[A-Z_]+=')"
          # The stack's own service-role key, minted with this runner's signing key and dying with it: the API and the worker sign and purge proof objects with it, server-side; masked all the same.
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - run: pnpm --filter @waste/web build
        env:
          WASTE_API_ORIGIN: http://127.0.0.1:3001
          NEXT_PUBLIC_WASTE_API_URL: /waste-api

      # The API and the worker from source under tsx, on their default ports,
      # their output kept for the failure artifact below. Playwright starts
      # only once both answer ready, bounded: two minutes for pg-boss to take
      # its queues and the API to reach its pool, else the step fails with
      # the last answers in the log.
      - name: Start the API and the worker
        run: |
          mkdir -p logs
          nohup pnpm --filter @waste/api start > logs/api.log 2>&1 &
          nohup pnpm --filter @waste/worker start > logs/worker.log 2>&1 &
      - name: Wait for both to answer ready
        uses: ./.github/actions/smoke-probes
        with:
          urls: |
            http://127.0.0.1:3001
            http://127.0.0.1:3002
          ready: "200"

      # playwright.api.config.ts serves the build on port 3000 under CI and
      # runs the suite serially with two retries. The served build reads the
      # API's origin at request time too: a public page (ADR-0010) asks the
      # public door from the server, where the browser's /waste-api rewrite
      # was fixed at build.
      - run: pnpm test:e2e:api
        env:
          WASTE_API_ORIGIN: http://127.0.0.1:3001

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-api
          path: |
            apps/web/playwright-report-api
            apps/web/test-results-api
          retention-days: 14
          if-no-files-found: ignore
      # A browser failure can be a background job's: the two processes' logs
      # go up beside the report when the job fails.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-api-process-logs
          path: logs
          retention-days: 14
          if-no-files-found: ignore
