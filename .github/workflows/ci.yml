name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1
  # The local Supabase stack the database steps below start (see .env.example).
  DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
  DATABASE_URL: postgresql://wms_api:wms_api@127.0.0.1:54322/postgres
  # The worker role's login (migration 0011); `pnpm db:bootstrap` gives it below.
  # The worker's suites read it: the generation test (#97 part B) logs in as
  # this role, pointed at a database of its own, for the sweep that reads
  # across companies; the relay test (#104 part C) runs the sweep as this
  # role and the stamp as the API role on another, reaching both with these
  # cluster-wide logins; the `run-billing` suite (#112 part B) sweeps the
  # active projects on this role's pool, the way the process does; the boot
  # test runs pg-boss as the owner on its own database. `pnpm test` reads it,
  # and REQUIRE_DATABASE below makes its absence a failure.
  WORKER_DATABASE_URL: postgresql://wms_worker:wms_worker@127.0.0.1:54322/postgres
  # A database test may not skip here.
  REQUIRE_DATABASE: "1"
  # The API refuses to start without the project whose tokens it verifies; its
  # tests sign tokens with a key set they generate and never fetch this one.
  SUPABASE_URL: https://example.supabase.co

jobs:
  verify:
    name: Install, typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from the packageManager field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

      # The database tests run against the same Postgres image as the hosted
      # project: the Supabase CLI (a root devDependency, so pnpm install brought
      # it) starts one container on the runner's Docker, migrations apply
      # through packages/db, and the API role gets its local login.
      - run: pnpm db:start
      - run: pnpm db:migrate
      - run: pnpm db:bootstrap
      # The demo company, as a fresh clone gets it: this step proves the seed
      # runs on a fresh stack, and it puts the company on the database the
      # suites below share. It runs once, so it says nothing about
      # idempotency; seed.test.ts proves that, on a database of its own.
      - run: pnpm db:seed

      # The Pilot's backup and restore (#152), rehearsed on this stack with
      # the client the protected workflow uses: the migrated and seeded
      # database backed up by pilot-backup.sh, its three schemas dropped,
      # restored by pilot-restore.sh inside the write barrier, and proved by
      # the journal check and its own fingerprint. The suites below then run
      # against the restored database, which makes every one of them a smoke
      # test of the restore. Client 17 is required here: its absence fails
      # the rehearsal and, through REQUIRE_DATABASE, pilot-rehearsal.test.ts.
      - uses: ./.github/actions/postgres-client
      - run: pnpm --filter @waste/db rehearse-restore

      - run: pnpm test
      - run: pnpm build

  api-image:
    name: Build API image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The image the root CLAUDE.md describes, built the way it says to,
      # from the repository root through apps/api/Dockerfile, on buildx so
      # its layers cache in GitHub's cache between runs: the install layer
      # is redone when a manifest or the lockfile changes, not when source
      # does. Loaded into the runner's Docker and pushed nowhere, since the
      # host is not chosen (docs/architecture/backend-architecture.md). The
      # commit goes in as SOURCE_COMMIT (#152): the image labels itself with
      # it and bakes it into build.json, which GET /healthz names.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: waste-api:ci
          build-args: SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The process starts with a database nobody answers on (loopback port
      # 1 is refused at once inside the container), so liveness must answer
      # 200 and readiness 503: the two answers apps/api/src/readiness.ts
      # promises. SUPABASE_URL is the workflow's placeholder; no token is
      # verified here. The step runs under bash -e, so a refused connection
      # is read as status 000 rather than aborting before the lines that say
      # what happened, and a process that died is failed at once, not after
      # thirty seconds of waiting for it.
      - name: Smoke test the image
        run: |
          docker run --detach --name api --publish 3001:3001 \
            --env DATABASE_URL=postgresql://wms_api:x@127.0.0.1:1/postgres \
            --env SUPABASE_URL="$SUPABASE_URL" \
            waste-api:ci
          status() { curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:3001$1" || echo 000; }
          body() { curl --silent "http://127.0.0.1:3001$1" || true; }
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Running}}' api)" != true ]; then
              echo "the container stopped before it answered (attempt $attempt)"
              exit 1
            fi
            [ "$(status /healthz)" = 200 ] && break
            sleep 1
          done
          healthz=$(status /healthz)
          readyz=$(status /readyz)
          echo "GET /healthz -> $healthz $(body /healthz)"
          echo "GET /readyz -> $readyz $(body /readyz)"
          test "$healthz" = 200 && test "$readyz" = 503
          # The build the image says it is (#152): the commit in the body, the
          # same commit on the label, and neither probe cacheable.
          body /healthz | jq --exit-status --arg commit "$GITHUB_SHA" '.build.commit == $commit'
          test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' waste-api:ci)" = "$GITHUB_SHA"
          for probe in /healthz /readyz; do
            curl --silent --output /dev/null --dump-header - "http://127.0.0.1:3001$probe" | tr -d '\r' | grep -qix 'cache-control: no-store'
          done
      - name: Container logs
        if: always()
        run: docker logs api || true

  worker-image:
    name: Build worker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The worker's image (apps/worker/Dockerfile, the API's recipe over the
      # worker's closure), built from the repository root on buildx with the
      # same cache, loaded and pushed nowhere: ADR-0007 names the host and
      # nothing deploys from CI yet.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/worker/Dockerfile
          push: false
          load: true
          tags: waste-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The other half of the API's smoke test: given a database nobody
      # answers on, the worker must not stay up. pg-boss checks its schema
      # before anything else, so the process exits non-zero with the dial's
      # error in its logs and never binds its probes — apps/worker/src/main.ts
      # says why a worker without its queues exits where the API answers 503.
      # The step waits for the exit rather than for a probe, and fails if the
      # container is still running after thirty seconds or exited 0.
      - name: Smoke test the image
        run: |
          docker run --detach --name worker --publish 3002:3002 \
            --env WORKER_DATABASE_URL=postgresql://wms_worker:x@127.0.0.1:1/postgres \
            --env DATABASE_URL=postgresql://wms_api:x@127.0.0.1:1/postgres \
            waste-worker:ci
          for attempt in $(seq 1 30); do
            [ "$(docker inspect --format '{{.State.Running}}' worker)" != true ] && break
            sleep 1
          done
          running=$(docker inspect --format '{{.State.Running}}' worker)
          code=$(docker inspect --format '{{.State.ExitCode}}' worker)
          echo "running=$running exit=$code"
          test "$running" = false && test "$code" != 0
          docker logs worker 2>&1 | grep -q "ECONNREFUSED"
      - name: Container logs
        if: always()
        run: docker logs worker || true

  e2e:
    name: End-to-end (web, Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The browser Playwright drives, cached under the @playwright/test
      # version pnpm install resolved — read from the installed package, not
      # from the specifier in apps/web/package.json, so a range or a lockfile
      # bump can never hit a cache holding the Chromium of an older Playwright
      # while the install step is skipped. A new Playwright wants a new
      # Chromium build, nothing else does. On a hit only the system libraries
      # Chromium links against are installed, since the cache holds the
      # browser and not them.
      - id: playwright
        run: echo "version=$(node -p "require('./apps/web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browser
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browser.outputs.cache-hit != 'true'
        run: pnpm --filter @waste/web exec playwright install --with-deps chromium
      - if: steps.browser.outputs.cache-hit == 'true'
        run: pnpm --filter @waste/web exec playwright install-deps chromium

      # The root tsconfig excludes e2e/, so `pnpm typecheck` in verify never
      # sees a spec; this is the one type check the suite gets.
      - run: pnpm typecheck:e2e

      # The web app alone: the suite needs no database and no API (fixture
      # data and localStorage; the one external service, OSRM, is stubbed
      # per test and the tile servers are aborted). verify builds the web app
      # too, through `pnpm build`; this job builds it again on purpose rather
      # than waiting on that job, since the two run side by side and the wait
      # plus the download of a .next output would cost about what the build
      # does — the minute and a half is the price of the wall time saved.
      # playwright.config.ts serves this build on port 3000 under CI, waits
      # for it to answer, and runs the suite with two retries; locally there
      # is no managed server.
      - run: pnpm --filter @waste/web build
      - run: pnpm test:e2e

      # Always, not only on failure: a spec that failed once and passed on a
      # retry leaves the job green (the github reporter annotates it flaky)
      # and its failed attempt's trace is the one thing that says why.
      # `if-no-files-found: ignore` covers the clean case.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14
          if-no-files-found: ignore
