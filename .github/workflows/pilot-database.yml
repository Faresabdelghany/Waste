# The one door to owner-level actions on the Pilot's database (Issue #152,
# decided in #133; the procedures are supabase/README.md). Since 2026-10-28
# (ADR-0011) the release runs by itself once CI has passed on a commit pushed
# to main, releasing exactly that commit; every operation, the release
# included, can still be dispatched by hand on main. One fixed operation per
# run, each its own job under the `pilot` environment, which admits main alone
# and no longer asks for the owner's approval. No input is ever SQL, a shell
# command or a path: an operation is a reviewed script below, and adding one
# is a reviewed change to this file.
#
#   check           the journal check, the fingerprint against the committed
#                   file (once nothing is pending), the service roles' LOGIN
#                   state and the publication's tables; writes nothing
#   release         a Pilot release, after CI on every push to main or by
#                   hand: CI green on the commit, the journal checked,
#                   an encrypted backup, the migrations, the seed on request,
#                   the journal and the fingerprint checked again, one
#                   release commit of this commit's tree on the deploy branch
#                   `pilot` (Suga builds the Pilot image from it, #149) and
#                   the build proved live — or, with deploy_api off, a
#                   database-only release. A `resolve` job without secrets
#                   comes first and skips a commit older than the one the
#                   deploy branch already releases
#   reset-to-seed   the demo company swept and written back as the seed says,
#                   inside the write barrier, after a safety backup
#   grant-logins    LOGIN for exactly wms_api and wms_worker from the
#                   environment's app-role URLs
#   restore         a named run's backup restored inside the write barrier
#   repair          one allow-listed repair module
#   recover-logins  the LOGIN states a named restore or reset recorded, put
#                   back after it failed or was cancelled
#
# Secrets are the `pilot` environment's and reach only the step that needs
# them, as that step's environment: never a job's or the workflow's, never
# printed, written to an artifact or put on a command line. The environment
# admits main alone; the owner removed its required reviewer on 2026-10-28
# (ADR-0011, superseding the approval gate of #133 and #152), so a job that
# names it runs without approval. What guards the Pilot instead is in the
# jobs: CI green on the exact commit, the journal check, an encrypted backup
# before every migration, the fingerprint check and the live proof. Every
# action is pinned by commit here, the one workflow that holds the owner's
# secret; a job installs @waste/db's dependencies from the lockfile and
# restores no cache. The workflow's token is read-only but for the release
# job, whose `contents: write` is what lets its last step move the deploy
# branch; every checkout keeps its credentials out of the tree.
name: Pilot database

on:
  # The automatic release: CI finished on a push to main. Only a successful,
  # pushed run of this repository releases (the resolve job's `if`), and it
  # releases that run's head_sha, never a newer main.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: The operation, one fixed job each (supabase/README.md)
        type: choice
        required: true
        options:
          - check
          - release
          - reset-to-seed
          - grant-logins
          - restore
          - repair
          - recover-logins
      run_seed:
        description: "release: run the idempotent demo seed after the migrations"
        type: boolean
        default: false
      deploy_api:
        description: "release: fast-forward the pilot branch Suga builds from to this commit and prove the build live (off: a database-only release)"
        type: boolean
        default: true
      source_run_id:
        description: "restore, recover-logins: the id of the run whose backup or login record to use"
        type: string
        default: ""
      services_suspended:
        description: "restore, reset-to-seed: the Pilot's Suga service (the API and the worker) is stopped"
        type: boolean
        default: false
      repair_id:
        description: "repair: the allow-listed repair, <issue>-<slug>"
        type: string
        default: ""

permissions:
  contents: read

# One operation at a time, and a migration is never cancelled by the next.
# GitHub keeps one pending run per group: a third run arriving while one runs
# and one waits replaces the waiting one, which shows as cancelled. For two
# automatic releases that is harmless, since the later commit carries the
# earlier; a hand dispatch replaced this way is dispatched again.
concurrency:
  group: pilot-database
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: 1
  # Which Supabase project and which host the Pilot is: not secrets (the ref is
  # the public API URL's), reviewed with this file, and what every script holds
  # the secret URL to before it connects.
  PILOT_SUPABASE_REF: ztmisreemxepvjxelbql
  PILOT_DATABASE_HOST: aws-0-eu-north-1.pooler.supabase.com
  # The deploy branch Suga builds the Pilot image from (#149, ADR-0008): a
  # release writes one commit on it (the released commit's tree plus the file
  # naming it), and nothing else moves it.
  PILOT_DEPLOY_BRANCH: pilot

jobs:
  check:
    name: Check the Pilot's database
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'check'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pilot
    steps:
      - name: Require main
        run: test "$GITHUB_REF" = refs/heads/main || { echo "::error::The Pilot's database is operated from main only"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/pilot-node
      - name: Journal check
        id: journal
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PILOT_DATABASE_ADMIN_URL }}
        run: pnpm db:check
      - name: Fingerprint against the committed file
        if: steps.journal.outputs.pending == '0'
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PILOT_DATABASE_ADMIN_URL }}
        run: pnpm db:fingerprint --check
      - name: Fingerprint deferred
        if: steps.journal.outputs.pending != '0'
        env:
          PENDING: ${{ steps.journal.outputs.pending }}
        run: echo "$PENDING migration(s) pending, so the committed fingerprint (the head's) does not apply yet; a release compares it after migrating." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Identity, logins and the publication
        working-directory: packages/db
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PILOT_DATABASE_ADMIN_URL }}
        run: node --import tsx scripts/pilot/state.ts

  # What a release releases, decided without a secret: the commit (CI's
  # head_sha after CI, this run's commit by hand), the settings (after CI the
  # API deployed and no seed), and whether it goes on at all, since a commit
  # older than the one the deploy branch already releases is skipped
  # (packages/db/src/pilot/release.ts, judgeOrder). Inside the workflow's
  # concurrency, so two releases decide and release one after the other.
  resolve:
    name: Resolve the release
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'release') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_COMMIT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      DEPLOY_API: ${{ github.event_name == 'workflow_run' || inputs.deploy_api }}
      RUN_SEED: ${{ github.event_name != 'workflow_run' && inputs.run_seed }}
    outputs:
      commit: ${{ env.RELEASE_COMMIT }}
      deploy_api: ${{ env.DEPLOY_API }}
      run_seed: ${{ env.RUN_SEED }}
      proceed: ${{ steps.order.outputs.proceed }}
    steps:
      - name: Require main
        run: test "$GITHUB_REF" = refs/heads/main || { echo "::error::The Pilot is released from main only"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          persist-credentials: false
      - uses: ./.github/actions/pilot-node
      - name: Release in main's order
        id: order
        working-directory: packages/db
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --import tsx scripts/pilot/order.ts

  release:
    name: Release to the Pilot
    needs: resolve
    if: needs.resolve.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pilot
    # The resolve job's decision, for every step below: never a secret.
    env:
      RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
      DEPLOY_API: ${{ needs.resolve.outputs.deploy_api }}
      RUN_SEED: ${{ needs.resolve.outputs.run_seed }}
    # `contents: write` for step 8 alone, the release commit on the deploy
    # branch, and `checks: read` for step 2, CI's proof of the commit; the
    # checkout below still keeps the token out of the tree, and each step
    # reads it as its own environment.
    permissions:
      contents: write
      checks: read
    steps:
      # 1. main, and nothing else.
      - name: Require main
        run: test "$GITHUB_REF" = refs/heads/main || { echo "::error::The Pilot is released from main only"; exit 1; }
      - name: Say what is released
        env:
          TRIGGER: ${{ github.event_name }}
        run: |
          kind=$([ "$DEPLOY_API" = true ] && echo "a release of the database and the Pilot image: the $PILOT_DEPLOY_BRANCH branch gets this commit's tree" || echo "a database-only release: the $PILOT_DEPLOY_BRANCH branch does not move, no URL read")
          by=$([ "$TRIGGER" = workflow_run ] && echo "after CI on main" || echo "by hand")
          echo "Commit $RELEASE_COMMIT, $by: $kind; seed: $RUN_SEED" | tee -a "$GITHUB_STEP_SUMMARY"
      # The released commit's tree, which after CI is not main's tip when main has moved on since.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          persist-credentials: false
      - uses: ./.github/actions/pilot-node
      # 2. CI's proof of this commit, in place of the image the old step resolved: the check runs REQUIRED_CHECKS names (packages/db/src/pilot/release.ts, held to ci.yml's job names by a test) completed with success, else nothing is written. Suga builds the image from the deploy branch, whose tree step 8 makes this commit's, so the code the release deploys is this commit by construction.
      - name: Require CI green on this commit
        if: env.DEPLOY_API == 'true'
        working-directory: packages/db
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --import tsx scripts/pilot/check-ci.ts
      # 3. The journal agrees with main's migrations before anything is written.
      - name: Journal check
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PILOT_DATABASE_ADMIN_URL }}
        run: pnpm db:check
      # 4. A backup on every release, uploaded before the migrations run; any failure stops the release here.
      - uses: ./.github/actions/postgres-client
      - name: Back up
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PILOT_DATABASE_ADMIN_URL }}
          BACKUP_OUTPUT: ${{ runner.temp }}/pilot-backup/pilot-backup-${{ github.run_id }}-${{ github.run_attempt }}.tar.age
        run: |
          mkdir -p "$(dirname "$BACKUP_OUTPUT")"
          bash packages/db/scripts/pilot-backup.sh
      - name: Upload the backup
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pilot-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pilot-backup/pilot-backup-${{ github.run_id }}-${{ github.run_attempt }}.tar.age
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      # 5. Every pending migration, in one transaction behind the journal check.
      - name: Migrate
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PILOT_DATABASE_ADMIN_URL }}
        run: pnpm db:migrate
      # 6. The seed, only when asked.
      - name: Seed
        if: env.RUN_SEED == 'true'
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PILOT_DATABASE_ADMIN_URL }}
        run: pnpm db:seed
      # 7. The journal again, and the complete fingerprint against the committed file.
      - name: Journal check and fingerprint
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PILOT_DATABASE_ADMIN_URL }}
        run: |
          pnpm db:check
          pnpm db:fingerprint --check
      # 8. One release commit on the deploy branch through GitHub's git data API, under the job's token (this step alone reads it): this commit's tree plus apps/pilot/release.json naming it, on the branch's head and this commit. Suga builds and rolls out from there, and the image writes the file into build.json, since Suga passes no commit into a build. Never forced: the branch's head is a parent, so it fast-forwards.
      - name: Deploy
        id: deploy
        if: env.DEPLOY_API == 'true'
        working-directory: packages/db
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --import tsx scripts/pilot/deploy.ts
      # 9. Three consecutive observations of the released build within ten minutes; the old build's answers while Suga builds count as not yet.
      - name: Prove it live
        if: env.DEPLOY_API == 'true'
        working-directory: packages/db
        env:
          PILOT_API_URL: ${{ vars.PILOT_API_URL }}
        run: node --import tsx scripts/pilot/observe.ts
      - name: Remove plaintext
        if: always()
        run: rm -rf "$RUNNER_TEMP"/pilot-backup.* "$RUNNER_TEMP/pilot-backup"

  reset-to-seed:
    name: Reset the Pilot to its seed
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'reset-to-seed'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pilot
    steps:
      - name: Require main and the confirmation
        env:
          SERVICES_SUSPENDED: ${{ inputs.services_suspended }}
        run: |
          test "$GITHUB_REF" = refs/heads/main || { echo "::error::The Pilot's database is operated from main only"; exit 1; }
          test "$SERVICES_SUSPENDED" = true || { echo "::error::Stop the Pilot's Suga service first, then dispatch the reset with services_suspended on"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/pilot-node
      - uses: ./.github/actions/postgres-client
      # The seed is main's, so the Pilot must be at main's schema before anything is written: a release brings it there.
      - name: Journal check
        id: journal
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PILOT_DATABASE_ADMIN_URL }}
        run: pnpm db:check
      - name: Refuse a Pilot behind main's migrations
        if: steps.journal.outputs.pending != '0'
        env:
          PENDING: ${{ steps.journal.outputs.pending }}
        run: |
          echo "::error::$PENDING migration(s) pending: the reset writes main's seed, which needs main's schema. Run release first."
          exit 1
      - name: Fingerprint against the committed file
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PILOT_DATABASE_ADMIN_URL }}
        run: pnpm db:fingerprint --check
      # A safety backup of the tenant as testers left it, restorable later by this run's id; any failure stops the reset here.
      - name: Back up the database as it is
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PILOT_DATABASE_ADMIN_URL }}
          BACKUP_OUTPUT: ${{ runner.temp }}/pilot-backup/pilot-backup-${{ github.run_id }}-${{ github.run_attempt }}.tar.age
        run: |
          mkdir -p "$(dirname "$BACKUP_OUTPUT")"
          bash packages/db/scripts/pilot-backup.sh
      - name: Upload the safety backup
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pilot-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pilot-backup/pilot-backup-${{ github.run_id }}-${{ github.run_attempt }}.tar.age
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      # The write barrier, as the restore closes it: the logins recorded and stored, read back, and only then closed.
      - name: Record the logins
        id: record
        working-directory: packages/db
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PILOT_DATABASE_ADMIN_URL }}
          BARRIER_OPERATION: reset-to-seed
          LOGIN_STATE_DIR: ${{ runner.temp }}/login-state
        run: node --import tsx scripts/pilot/barrier.ts record
      - name: Store the login record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: login-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/login-state/login-state.json
          if-no-files-found: error
          retention-days: 90
      - name: Read the login record back
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: login-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/login-state-copy
          digest-mismatch: error
      - name: Close the barrier
        working-directory: packages/db
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PILOT_DATABASE_ADMIN_URL }}
          LOGIN_STATE_COPY: ${{ runner.temp }}/login-state-copy/login-state.json
          LOGIN_STATE_SHA256: ${{ steps.record.outputs.sha256 }}
        run: node --import tsx scripts/pilot/barrier.ts close
      # One owner transaction: the demo company swept and the seed written back, committed only when the seed finds nothing left to change and the counters are the seed's.
      - name: Sweep and seed
        working-directory: packages/db
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PILOT_DATABASE_ADMIN_URL }}
        run: node --import tsx scripts/reset-to-seed.ts
      - name: Check the reset database
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PILOT_DATABASE_ADMIN_URL }}
        run: |
          pnpm db:check
          pnpm db:fingerprint --check
      # Only after every check: the recorded logins back. On any failure above they stay NOLOGIN: recover-logins with this run's id.
      - name: Open the barrier
        working-directory: packages/db
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PILOT_DATABASE_ADMIN_URL }}
          LOGIN_STATE_FILE: ${{ runner.temp }}/login-state/login-state.json
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: node --import tsx scripts/pilot/barrier.ts open
      - name: Verify the roles and the publication
        working-directory: packages/db
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PILOT_DATABASE_ADMIN_URL }}
        run: node --import tsx scripts/pilot/state.ts
      - name: Remove plaintext
        if: always()
        run: rm -rf "$RUNNER_TEMP"/pilot-backup.* "$RUNNER_TEMP/pilot-backup"

  grant-logins:
    name: Grant the app roles' logins
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'grant-logins'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pilot
    steps:
      - name: Require main
        run: test "$GITHUB_REF" = refs/heads/main || { echo "::error::The Pilot's database is operated from main only"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/pilot-node
      - name: Grant LOGIN to wms_api and wms_worker
        working-directory: packages/db
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PILOT_DATABASE_ADMIN_URL }}
          PILOT_DATABASE_URL: ${{ secrets.PILOT_DATABASE_URL }}
          PILOT_WORKER_DATABASE_URL: ${{ secrets.PILOT_WORKER_DATABASE_URL }}
        run: node --import tsx scripts/pilot/grant-logins.ts

  restore:
    name: Restore the Pilot from a backup
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'restore'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pilot
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require main, the confirmation and a run id
        env:
          SERVICES_SUSPENDED: ${{ inputs.services_suspended }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          test "$GITHUB_REF" = refs/heads/main || { echo "::error::The Pilot's database is operated from main only"; exit 1; }
          test "$SERVICES_SUSPENDED" = true || { echo "::error::Stop the Pilot's Suga service first, then dispatch the restore with services_suspended on"; exit 1; }
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::source_run_id names no run"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/pilot-node
      - uses: ./.github/actions/postgres-client
      - name: Choose the backup
        id: source
        working-directory: packages/db
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          ARTIFACT_PREFIX: pilot-backup
        run: node --import tsx scripts/pilot/select-artifact.ts
      # The package's checksum: the artifact store's digest of what the
      # backup's run uploaded, which the download refuses to differ from; the
      # manifest's checksums are the dumps', verified after decryption.
      - name: Download the backup
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.source.outputs.id }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pilot-source
          digest-mismatch: error
      # A safety backup of the database as it is, restorable later by this
      # run's id. Any failure stops the restore, but one: a database that lost
      # a schema the backup requires (pilot-backup.sh's exit 3), the case a
      # restore is for, cannot be backed up whole, and the restore goes on
      # without one, saying so.
      - name: Back up the database as it is
        id: safety
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PILOT_DATABASE_ADMIN_URL }}
          BACKUP_OUTPUT: ${{ runner.temp }}/pilot-backup/pilot-backup-${{ github.run_id }}-${{ github.run_attempt }}.tar.age
        run: |
          mkdir -p "$(dirname "$BACKUP_OUTPUT")"
          status=0
          bash packages/db/scripts/pilot-backup.sh || status=$?
          if [ "$status" = 3 ]; then
            echo "No safety backup: the database lacks a schema a backup requires, so it cannot be backed up whole. The restore goes on." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "taken=false" >> "$GITHUB_OUTPUT"
          elif [ "$status" != 0 ]; then
            exit "$status"
          else
            echo "taken=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload the safety backup
        if: steps.safety.outputs.taken == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pilot-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pilot-backup/pilot-backup-${{ github.run_id }}-${{ github.run_attempt }}.tar.age
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Decrypt the backup
        env:
          AGE_IDENTITY: ${{ secrets.PILOT_BACKUP_AGE_KEY }}
          RESTORE_DIR: ${{ runner.temp }}/pilot-restore
        run: |
          shopt -s nullglob
          found=("$RUNNER_TEMP"/pilot-source/*.tar.age "$RUNNER_TEMP"/pilot-source/*/*.tar.age)
          test "${#found[@]}" = 1 || { echo "::error::the downloaded artifact holds ${#found[@]} encrypted backups, not one"; exit 1; }
          BACKUP_FILE="${found[0]}" bash packages/db/scripts/pilot-restore.sh decrypt
      - name: Verify the backup
        working-directory: packages/db
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PILOT_DATABASE_ADMIN_URL }}
          RESTORE_DIR: ${{ runner.temp }}/pilot-restore
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_ATTEMPT: ${{ steps.source.outputs.attempt }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: node --import tsx scripts/pilot/manifest.ts verify
      # The write barrier: the logins recorded and stored, read back, and only then closed.
      - name: Record the logins
        id: record
        working-directory: packages/db
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PILOT_DATABASE_ADMIN_URL }}
          BARRIER_OPERATION: restore
          LOGIN_STATE_DIR: ${{ runner.temp }}/login-state
        run: node --import tsx scripts/pilot/barrier.ts record
      - name: Store the login record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: login-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/login-state/login-state.json
          if-no-files-found: error
          retention-days: 90
      - name: Read the login record back
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: login-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/login-state-copy
          digest-mismatch: error
      - name: Close the barrier
        working-directory: packages/db
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PILOT_DATABASE_ADMIN_URL }}
          LOGIN_STATE_COPY: ${{ runner.temp }}/login-state-copy/login-state.json
          LOGIN_STATE_SHA256: ${{ steps.record.outputs.sha256 }}
        run: node --import tsx scripts/pilot/barrier.ts close
      # One transaction: the three schemas dropped and the backup restored, or nothing.
      - name: Restore
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PILOT_DATABASE_ADMIN_URL }}
          RESTORE_DIR: ${{ runner.temp }}/pilot-restore
        run: bash packages/db/scripts/pilot-restore.sh apply
      - name: Check the restored database
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PILOT_DATABASE_ADMIN_URL }}
          FINGERPRINT: ${{ runner.temp }}/pilot-restore/fingerprint.txt
        run: |
          pnpm db:check
          pnpm db:fingerprint --check "$FINGERPRINT"
      # Only after every check: the recorded logins back. On any failure above they stay NOLOGIN: recover-logins with this run's id.
      - name: Open the barrier
        working-directory: packages/db
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PILOT_DATABASE_ADMIN_URL }}
          LOGIN_STATE_FILE: ${{ runner.temp }}/login-state/login-state.json
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: node --import tsx scripts/pilot/barrier.ts open
      # The roles and the publication as the restore left them — the check's own report, which fails while wms_api cannot log in.
      - name: Verify the roles and the publication
        working-directory: packages/db
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PILOT_DATABASE_ADMIN_URL }}
        run: node --import tsx scripts/pilot/state.ts
      - name: Remove plaintext
        if: always()
        run: rm -rf "$RUNNER_TEMP"/pilot-backup.* "$RUNNER_TEMP"/pilot-restore-key.* "$RUNNER_TEMP/pilot-restore" "$RUNNER_TEMP/pilot-source" "$RUNNER_TEMP/pilot-backup"

  repair:
    name: Run an allow-listed repair
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'repair'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pilot
    steps:
      - name: Require main and a repair id
        env:
          REPAIR_ID: ${{ inputs.repair_id }}
        run: |
          test "$GITHUB_REF" = refs/heads/main || { echo "::error::The Pilot's database is operated from main only"; exit 1; }
          [[ "$REPAIR_ID" =~ ^[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$ ]] || { echo "::error::repair_id is not <issue>-<slug>"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/pilot-node
      - name: Repair
        working-directory: packages/db
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PILOT_DATABASE_ADMIN_URL }}
          REPAIR_ID: ${{ inputs.repair_id }}
        run: node --import tsx scripts/pilot/repair.ts

  recover-logins:
    name: Recover the app roles' logins
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'recover-logins'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pilot
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require main and a run id
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          test "$GITHUB_REF" = refs/heads/main || { echo "::error::The Pilot's database is operated from main only"; exit 1; }
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::source_run_id names no run"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/pilot-node
      - name: Choose the login record
        id: source
        working-directory: packages/db
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          ARTIFACT_PREFIX: login-state
        run: node --import tsx scripts/pilot/select-artifact.ts
      - name: Download the login record
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.source.outputs.id }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/login-state-source
          digest-mismatch: error
      - name: Restore the recorded logins
        working-directory: packages/db
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PILOT_DATABASE_ADMIN_URL }}
          SOURCE_DIR: ${{ runner.temp }}/login-state-source
          EXPECTED_RUN_ID: ${{ inputs.source_run_id }}
          EXPECTED_ATTEMPT: ${{ steps.source.outputs.attempt }}
          EXPECTED_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          shopt -s nullglob
          found=("$SOURCE_DIR"/login-state.json "$SOURCE_DIR"/*/login-state.json)
          test "${#found[@]}" = 1 || { echo "::error::the downloaded artifact holds ${#found[@]} login records, not one"; exit 1; }
          LOGIN_STATE_FILE="${found[0]}" node --import tsx scripts/pilot/barrier.ts open
