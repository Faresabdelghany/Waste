# The one door to owner-level actions on the Pilot's database (Issue #152,
# decided in #133; the procedures are supabase/README.md). Since 2026-10-28
# (ADR-0011) the release runs by itself once CI has passed on a commit pushed
# to main, releasing exactly that commit; every operation, the release
# included, can still be dispatched by hand on main. One fixed operation per
# run, each its own job under the `pilot` environment, which admits main alone
# and no longer asks for the owner's approval. No input is ever SQL, a shell
# command or a path: an operation is a reviewed list of phases, and adding
# one is a reviewed change to it and to this file.
#
#   check           the journal check, the fingerprint against the committed
#                   file (once nothing is pending) and the service roles'
#                   LOGIN state; writes nothing
#   release         a Pilot release, after CI on every push to main or by
#                   hand: CI green on the commit, the journal checked,
#                   an encrypted backup, the migrations, the seed on request,
#                   the journal and the fingerprint checked again, one
#                   release commit of this commit's tree on the deploy branch
#                   `pilot` (Suga builds the Pilot image from it, #149) and
#                   the build proved live — or, with deploy_api off, a
#                   database-only release. A `resolve` job without secrets
#                   comes first and skips a commit older than the one the
#                   deploy branch already releases
#   reset-to-seed   the demo company swept and written back as the seed says,
#                   inside the write barrier, after a safety backup
#   grant-logins    LOGIN for exactly the app roles packages/db/src/roles.ts
#                   gives a URL of their own, from the environment's URLs
#   restore         a named run's backup restored inside the write barrier
#   recover-logins  the LOGIN states a named restore or reset recorded, put
#                   back after it failed or was cancelled
#
# Each operation is the list of phases apps/pilot/src/operations.ts gives it,
# in order, and a job is their thin caller: the checkout, the workspace, then
# one step per phase (`src/operate.ts <operation> <phase>`), whose
# environment is all that phase reads, and between two phases only what a
# script cannot do — storing the artifact the phase before named in its
# outputs, or downloading the one a phase chose. A phase refuses a run off
# main, holds the owner's URL to PILOT_SUPABASE_REF before it connects, and
# checks its operation's inputs itself (packages/db/src/pilot/phase.ts);
# apps/pilot's operations test holds every job here to its list.
#
# Secrets are the `pilot` environment's and reach only the step that needs
# them, as that step's environment: never a job's or the workflow's, never
# printed, written to an artifact or put on a command line. The environment
# admits main alone; the owner removed its required reviewer on 2026-10-28
# (ADR-0011, superseding the approval gate of #133 and #152), so a job that
# names it runs without approval. What guards the Pilot instead is in the
# jobs: CI green on the exact commit, the journal check, an encrypted backup
# before every migration, the fingerprint check and the live proof. Every
# action is pinned by commit here and in the two actions this file adds
# (pilot-backup, write-barrier), the one workflow that holds the owner's
# secret; a job installs apps/pilot's closure from the lockfile and restores
# no cache. The workflow's token is read-only but for the release job, whose
# `contents: write` is what lets its deploy phase move the deploy branch;
# every checkout keeps its credentials out of the tree.
name: Pilot database

on:
  # The automatic release: CI finished on a push to main. Only a successful,
  # pushed run of this repository releases (the resolve job's `if`), and it
  # releases that run's head_sha, never a newer main.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: The operation, one fixed job each (supabase/README.md)
        type: choice
        required: true
        options:
          - check
          - release
          - reset-to-seed
          - grant-logins
          - restore
          - recover-logins
      run_seed:
        description: "release: run the idempotent demo seed after the migrations"
        type: boolean
        default: false
      deploy_api:
        description: "release: fast-forward the pilot branch Suga builds from to this commit and prove the build live (off: a database-only release)"
        type: boolean
        default: true
      source_run_id:
        description: "restore, recover-logins: the id of the run whose backup or login record to use"
        type: string
        default: ""
      services_suspended:
        description: "restore, reset-to-seed: the Pilot's Suga service (the API and the worker) is stopped"
        type: boolean
        default: false

permissions:
  contents: read

# One operation at a time, and a migration is never cancelled by the next.
# GitHub keeps one pending run per group: a third run arriving while one runs
# and one waits replaces the waiting one, which shows as cancelled. For two
# automatic releases that is harmless, since the later commit carries the
# earlier; a hand dispatch replaced this way is dispatched again.
concurrency:
  group: pilot-database
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: 1
  # Which Supabase project and which host the Pilot is: not secrets (the ref is
  # the public API URL's), reviewed with this file, and what every phase holds
  # the secret URL to before it connects.
  PILOT_SUPABASE_REF: ztmisreemxepvjxelbql
  PILOT_DATABASE_HOST: aws-0-eu-north-1.pooler.supabase.com
  # The deploy branch Suga builds the Pilot image from (#149, ADR-0008): a
  # release writes one commit on it (the released commit's tree plus the file
  # naming it), and nothing else moves it.
  PILOT_DEPLOY_BRANCH: pilot

jobs:
  check:
    name: Check the Pilot's database
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'check'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pilot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          filter: "@waste/pilot..."
          cache: "false"
      - name: Journal, fingerprint, identity and logins
        working-directory: apps/pilot
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PILOT_DATABASE_ADMIN_URL }}
        run: node --import tsx src/operate.ts check inspect

  # What a release releases, decided without a secret: the commit (CI's
  # head_sha after CI, this run's commit by hand), the settings (after CI the
  # API deployed and no seed), and whether it goes on at all, since a commit
  # older than the one the deploy branch already releases is skipped
  # (apps/pilot/src/release.ts, judgeOrder). Inside the workflow's
  # concurrency, so two releases decide and release one after the other.
  resolve:
    name: Resolve the release
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'release') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_COMMIT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      DEPLOY_API: ${{ github.event_name == 'workflow_run' || inputs.deploy_api }}
      RUN_SEED: ${{ github.event_name != 'workflow_run' && inputs.run_seed }}
    outputs:
      commit: ${{ env.RELEASE_COMMIT }}
      deploy_api: ${{ env.DEPLOY_API }}
      run_seed: ${{ env.RUN_SEED }}
      proceed: ${{ steps.order.outputs.proceed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          filter: "@waste/pilot..."
          cache: "false"
      # 0. On main, and not older than what the deploy branch releases.
      - name: Release in main's order
        id: order
        working-directory: apps/pilot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --import tsx src/operate.ts release order

  release:
    name: Release to the Pilot
    needs: resolve
    if: needs.resolve.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pilot
    # The resolve job's decision, for every step below: never a secret.
    env:
      RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
      DEPLOY_API: ${{ needs.resolve.outputs.deploy_api }}
      RUN_SEED: ${{ needs.resolve.outputs.run_seed }}
    # `contents: write` for the deploy phase alone, the release commit on the
    # deploy branch, and `checks: read` for the prove phase, CI's proof of the
    # commit; the checkout below still keeps the token out of the tree, and
    # each phase reads it as its own environment.
    permissions:
      contents: write
      checks: read
    steps:
      # 1. The released commit's tree, which after CI is not main's tip when main has moved on since.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          filter: "@waste/pilot..."
          cache: "false"
      # 2. What is released, said; with deploy_api, CI's proof of this commit (REQUIRED_CHECKS, apps/pilot/src/release.ts) before anything is written.
      - name: Say what is released and require CI green on this commit
        working-directory: apps/pilot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --import tsx src/operate.ts release prove
      # 3–4. The journal agrees with main's migrations, then a backup on every release, stored before the migrations run.
      - uses: ./.github/actions/postgres-client
      - name: Journal check and back up
        id: backup
        working-directory: apps/pilot
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PILOT_DATABASE_ADMIN_URL }}
        run: node --import tsx src/operate.ts release back-up
      - uses: ./.github/actions/pilot-backup
        with:
          taken: ${{ steps.backup.outputs.taken }}
          name: ${{ steps.backup.outputs.artifact }}
          path: ${{ steps.backup.outputs.file }}
      # 5–7. Every pending migration in one transaction behind the journal check, the seed where asked, the journal again and the complete fingerprint.
      - name: Migrate, seed, journal check and fingerprint
        working-directory: apps/pilot
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PILOT_DATABASE_ADMIN_URL }}
        run: node --import tsx src/operate.ts release migrate
      # 8. With deploy_api, one release commit on the deploy branch through GitHub's git data API, under the job's token: this commit's tree plus apps/pilot/release.json naming it. Never forced.
      - name: Deploy
        id: deploy
        working-directory: apps/pilot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --import tsx src/operate.ts release deploy
      # 9. With deploy_api, three consecutive observations of the released build within ten minutes.
      - name: Prove it live
        working-directory: apps/pilot
        env:
          PILOT_API_URL: ${{ vars.PILOT_API_URL }}
        run: node --import tsx src/operate.ts release observe
      - name: Remove plaintext
        if: always()
        working-directory: apps/pilot
        run: node --import tsx src/operate.ts release remove-plaintext

  reset-to-seed:
    name: Reset the Pilot to its seed
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'reset-to-seed'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pilot
    env:
      SERVICES_SUSPENDED: ${{ inputs.services_suspended }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          filter: "@waste/pilot..."
          cache: "false"
      - uses: ./.github/actions/postgres-client
      # The seed is main's, so the Pilot must be at main's schema before anything is written; then a safety backup of the tenant as testers left it, restorable later by this run's id.
      - name: Journal check, fingerprint and back up the database as it is
        id: backup
        working-directory: apps/pilot
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PILOT_DATABASE_ADMIN_URL }}
        run: node --import tsx src/operate.ts reset-to-seed back-up
      - uses: ./.github/actions/pilot-backup
        with:
          taken: ${{ steps.backup.outputs.taken }}
          name: ${{ steps.backup.outputs.artifact }}
          path: ${{ steps.backup.outputs.file }}
      # The write barrier: the logins recorded, stored and read back, and only then closed.
      - name: Record the logins
        id: record
        working-directory: apps/pilot
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PILOT_DATABASE_ADMIN_URL }}
        run: node --import tsx src/operate.ts reset-to-seed record
      - uses: ./.github/actions/write-barrier
        with:
          name: ${{ steps.record.outputs.artifact }}
          path: ${{ steps.record.outputs.file }}
          copy: ${{ steps.record.outputs.copy }}
      # One owner transaction, the sweep and the seed, then the checks; the recorded logins back only after every check. On any failure they stay NOLOGIN: recover-logins with this run's id.
      - name: Close the barrier, sweep and seed, check, and open it
        working-directory: apps/pilot
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PILOT_DATABASE_ADMIN_URL }}
        run: node --import tsx src/operate.ts reset-to-seed sweep
      - name: Remove plaintext
        if: always()
        working-directory: apps/pilot
        run: node --import tsx src/operate.ts reset-to-seed remove-plaintext

  grant-logins:
    name: Grant the app roles' logins
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'grant-logins'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pilot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          filter: "@waste/pilot..."
          cache: "false"
      # The owner's URL, and one `pilot` secret for every role packages/db/src/roles.ts gives a URL of its own, under that secret's name.
      - name: Grant LOGIN to the app roles
        working-directory: apps/pilot
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PILOT_DATABASE_ADMIN_URL }}
          PILOT_DATABASE_URL: ${{ secrets.PILOT_DATABASE_URL }}
          PILOT_WORKER_DATABASE_URL: ${{ secrets.PILOT_WORKER_DATABASE_URL }}
        run: node --import tsx src/operate.ts grant-logins grant

  restore:
    name: Restore the Pilot from a backup
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'restore'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pilot
    permissions:
      contents: read
      actions: read
    env:
      SERVICES_SUSPENDED: ${{ inputs.services_suspended }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          filter: "@waste/pilot..."
          cache: "false"
      - uses: ./.github/actions/postgres-client
      - name: Choose the backup
        id: source
        working-directory: apps/pilot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --import tsx src/operate.ts restore choose
      # The package's checksum: the artifact store's digest of what the
      # backup's run uploaded, which the download refuses to differ from; the
      # manifest's checksums are the dumps', verified after decryption.
      - name: Download the backup
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.source.outputs.id }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ steps.source.outputs.path }}
          digest-mismatch: error
      # A safety backup of the database as it is, restorable later by this
      # run's id. Any failure stops the restore, but one: a database that lost
      # a schema the backup requires, the case a restore is for, cannot be
      # backed up whole, and the restore goes on without one, saying so.
      - name: Back up the database as it is
        id: backup
        working-directory: apps/pilot
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PILOT_DATABASE_ADMIN_URL }}
        run: node --import tsx src/operate.ts restore back-up
      - uses: ./.github/actions/pilot-backup
        with:
          taken: ${{ steps.backup.outputs.taken }}
          name: ${{ steps.backup.outputs.artifact }}
          path: ${{ steps.backup.outputs.file }}
      - name: Decrypt the backup
        working-directory: apps/pilot
        env:
          AGE_IDENTITY: ${{ secrets.PILOT_BACKUP_AGE_KEY }}
        run: node --import tsx src/operate.ts restore decrypt
      # The write barrier: the backup verified, the logins recorded, stored and read back, and only then closed.
      - name: Verify the backup and record the logins
        id: record
        working-directory: apps/pilot
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PILOT_DATABASE_ADMIN_URL }}
        run: node --import tsx src/operate.ts restore record
      - uses: ./.github/actions/write-barrier
        with:
          name: ${{ steps.record.outputs.artifact }}
          path: ${{ steps.record.outputs.file }}
          copy: ${{ steps.record.outputs.copy }}
      # One transaction, the three schemas dropped and the backup restored, then the checks; the recorded logins back only after every check. On any failure they stay NOLOGIN: recover-logins with this run's id.
      - name: Close the barrier, restore, check, and open it
        working-directory: apps/pilot
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PILOT_DATABASE_ADMIN_URL }}
        run: node --import tsx src/operate.ts restore apply
      - name: Remove plaintext
        if: always()
        working-directory: apps/pilot
        run: node --import tsx src/operate.ts restore remove-plaintext

  recover-logins:
    name: Recover the app roles' logins
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'recover-logins'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pilot
    permissions:
      contents: read
      actions: read
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          filter: "@waste/pilot..."
          cache: "false"
      - name: Choose the login record
        id: source
        working-directory: apps/pilot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --import tsx src/operate.ts recover-logins choose
      - name: Download the login record
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.source.outputs.id }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ steps.source.outputs.path }}
          digest-mismatch: error
      - name: Restore the recorded logins
        working-directory: apps/pilot
        env:
          DATABASE_ADMIN_URL: ${{ secrets.PILOT_DATABASE_ADMIN_URL }}
        run: node --import tsx src/operate.ts recover-logins recover
