# PROTOTYPE — throwaway, ticket #134. Publishes the Pilot image
# (apps/pilot/Dockerfile) from THIS branch to GHCR so the prototype's hosted
# gates can pull it: gate 5 (a package linked to the public repository pulled
# by Render without credentials) and gate 6 (Render's deploy hook for an
# image-based service). Dispatched by hand on the prototype branch only; the
# real publish is CI's `Build pilot image` job on `main` merges (#149), and
# this file never merges. GITHUB_TOKEN's `packages: write` is the only
# credential — no PAT (#133). The package is private when first created and
# is made public once, by hand, in its package settings.
name: Pilot image (prototype, #134)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/faresabdelghany/waste-pilot

jobs:
  publish:
    name: Build, smoke-test and publish the prototype image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built for Render's runners (linux/amd64) with the commit baked in, so
      # /healthz names it; loaded locally first for the smoke test below.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/pilot/Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          build-args: SOURCE_COMMIT=${{ github.sha }}
          tags: waste-pilot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The CI api-image smoke test over the Pilot image: against a database
      # nobody answers on, /healthz 200 naming this commit, /readyz 503, and
      # the worker child restarted with backoff in the supervisor's log.
      - name: Smoke test the image
        run: |
          docker run --detach --name pilot --publish 3001:3001 \
            --env DATABASE_URL=postgresql://wms_api:x@127.0.0.1:1/postgres \
            --env WORKER_DATABASE_URL=postgresql://wms_worker:x@127.0.0.1:1/postgres \
            --env SUPABASE_URL=https://example.supabase.co \
            waste-pilot:ci
          status() { curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:3001$1" || echo 000; }
          for attempt in $(seq 1 40); do
            if [ "$(docker inspect --format '{{.State.Running}}' pilot)" != true ]; then
              echo "the container stopped before it answered (attempt $attempt)"; docker logs pilot; exit 1
            fi
            [ "$(status /healthz)" = 200 ] && break
            sleep 1
          done
          healthz=$(curl --silent http://127.0.0.1:3001/healthz)
          readyz=$(status /readyz)
          echo "GET /healthz -> $healthz"
          echo "GET /readyz -> $readyz"
          echo "$healthz" | grep -q "\"commit\":\"$GITHUB_SHA\"" || { echo "::error::/healthz does not name this commit"; exit 1; }
          test "$readyz" = 503
          sleep 8
          docker logs pilot 2>&1 | grep -E '^\[pilot\] worker exited .* restarting in 5 s' || { echo "::error::no worker restart with backoff in the log"; docker logs pilot; exit 1; }
          docker stop pilot >/dev/null
          test "$(docker inspect --format '{{.State.ExitCode}}' pilot)" = 0
      - name: Container logs
        if: always()
        run: docker logs pilot 2>&1 | grep -E '^\[pilot\]' || true

      - name: Publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/pilot/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: SOURCE_COMMIT=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:proto
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
      - name: Say what was published
        run: echo "Published $IMAGE:proto and $IMAGE:sha-$GITHUB_SHA (private until its package settings say public)" | tee -a "$GITHUB_STEP_SUMMARY"
